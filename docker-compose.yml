version: '3.8'

services:
  postgres:
    image: postgres:18.4
    container_name: chatbot-postgres
    environment:
      POSTGRES_DB: chat_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_agents"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network

  migrate:
    build: .
    container_name: chatbot-migrate
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/chat_agents
    command: ["sh", "-c", "cd /app/backend && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network

  backend:
    build: .
    container_name: chatbot-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/chat_agents
      - PORT=8080
    command: ["uvicorn", "chat_agents.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - chatbot-network

  frontend:
    build: .
    container_name: chatbot-frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
    environment:
      - BACKEND_URL=http://backend:8080
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-network

volumes:
  postgres-data:

networks:
  chatbot-network:
    driver: bridge
