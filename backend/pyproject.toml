[build-system]
requires = ["uv_build>=0.7.19,<0.10"]
build-backend = "uv_build"

[project]
name = "chat-agents"
# uv_build does not support VCS-derived versions; git tags are the release truth.
version = "0.0.0"
description = "Yuan's Chat Agents backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.109.1",
    "uvicorn==0.27.0",
    "python-dotenv==1.1.0",
    "pydantic==2.11.7",
    "requests==2.32.3",
    "langchain==0.3.25",
    "langchain-core==0.3.65",
    "langchain-anthropic>=0.1.0",
    "langchain-groq==0.3.2",
    "langchain-tavily==0.2.6",
    "langgraph==0.4.8",
    # langgraph 0.4.8 expects the 2.x checkpoint serializer API.
    "langgraph-checkpoint==2.0.26",
    "langgraph-prebuilt==0.2.2",
    "tavily-python==0.7.6",
    "typing-extensions>=4.14",
    "python-jose",
    "starlette>=0.40.0",
    "setuptools==70.0.0",
    "filelock==3.12.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "openai>=3.0.0,<4",
    "httpx2>=2.9,<3",
    "anthropic>=0.99.0,<1",
    "ag-ui-protocol==0.1.19",
    "sse-starlette>=3.4.8",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.7.0",
    "jsonschema>=4.26.0",
    "mypy>=1.13.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "schemathesis==4.24.3",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Fullwidth punctuation is intentional in Chinese strings and docstrings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["."]
exclude = ["dist/", "\\.venv/"]
plugins = ["pydantic.mypy"]
# Third-party LLM packages may lack stubs or use newer stub syntax.
follow_imports = "skip"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = '-m "not eval and not upstream and not contract"'
markers = [
    "eval: paid or comparative evaluation; excluded from the default test run",
    "upstream: calls a live upstream service; excluded from the default test run",
    "db: requires a running PostgreSQL database",
    "contract: in-process OpenAPI contract gate",
]


[tool.importlinter]
root_package = "chat_agents"

[[tool.importlinter.contracts]]
# ADR-0007：llm/ 是共享叶子——三协议契约测试要能在零数据库、零 FastAPI 下跑。
name = "LLM 模块保持为共享叶子"
type = "forbidden"
source_modules = ["chat_agents.llm"]
forbidden_modules = [
    "chat_agents.agent",
    "chat_agents.conversation",
    "chat_agents.observability",
    "chat_agents.tools",
    "chat_agents.transport",
]

[[tool.importlinter.contracts]]
# tools/ 只通过 ToolExecutionContext 的结构接口拿运行内依赖，不认识具体实现。
name = "Tools 模块保持为共享叶子"
type = "forbidden"
source_modules = ["chat_agents.tools"]
forbidden_modules = [
    "chat_agents.agent",
    "chat_agents.conversation",
    "chat_agents.llm",
    "chat_agents.observability",
    "chat_agents.transport",
]

[[tool.importlinter.contracts]]
# 观测可丢、业务不可丢：业务一旦反向依赖观测，「观测写失败不影响业务」就作废了。
name = "业务与边界模块不得反向依赖观测实现"
type = "forbidden"
source_modules = [
    "chat_agents.agent",
    "chat_agents.conversation",
    "chat_agents.llm",
    "chat_agents.tools",
    "chat_agents.transport",
]
forbidden_modules = ["chat_agents.observability"]

[[tool.importlinter.contracts]]
# 分层而非互相独立：conversation/transport 读 agent 的领域事件是设计（外层包装
# 内层），反向才是环。layers 只禁反向边，正向边照常放行。
name = "顶层包之间不得形成依赖环"
type = "layers"
layers = [
    "chat_agents.observability",
    "chat_agents.transport",
    "chat_agents.conversation",
    "chat_agents.agent",
]
