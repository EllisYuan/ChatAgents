[build-system]
requires = ["uv_build>=0.7.19,<0.10"]
build-backend = "uv_build"

[project]
name = "chat-agents"
# uv_build does not support VCS-derived versions; git tags are the release truth.
version = "0.0.0"
description = "Yuan's Chat Agents backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.32.0",
    "fastapi>=0.109.1",
    "uvicorn==0.27.0",
    "python-dotenv==1.1.0",
    "pydantic==2.11.7",
    "requests==2.32.3",
    "langchain==0.3.25",
    "langchain-core==0.3.65",
    "langchain-anthropic>=0.1.0",
    "langchain-openai==0.3.23",
    "langchain-groq==0.3.2",
    "langchain-tavily==0.2.6",
    "langgraph==0.4.8",
    # langgraph 0.4.8 expects the 2.x checkpoint serializer API.
    "langgraph-checkpoint==2.0.26",
    "langgraph-prebuilt==0.2.2",
    "tavily-python==0.7.6",
    "typing-extensions==4.12.2",
    "python-jose",
    "starlette>=0.40.0",
    "setuptools==70.0.0",
    "filelock==3.12.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Fullwidth punctuation is intentional in Chinese strings and docstrings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["."]
exclude = ["dist/", "\\.venv/"]
plugins = ["pydantic.mypy"]
# Third-party LLM packages may lack stubs or use newer stub syntax.
follow_imports = "skip"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
markers = [
    "db: requires a running PostgreSQL database",
]
