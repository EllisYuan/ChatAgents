# 应用属性的那半份 Nginx 配置（ADR-0032）。
#
# 只含「换一台服务器还成立」的部分：location 路由、SSE 缓冲开关、
# 静态资源的 try_files。TLS、证书、监听端口归宝塔面板管，不在这里。
#
# 挂载方式：宝塔站点配置里加一行
#   include /www/chatagents/repo/deploy/nginx/site.conf;
# 这份文件随 git checkout 换版，在宝塔面板里改会被下一次部署覆盖——见 README。
#
# 这份文件本身不是一个完整的 server 块，单独看会显得残缺（没有
# listen、没有 ssl_certificate），它本来就只是一个 include 片段。

# /api/ 只穿这一层 nginx 直连后端，不再经过容器内 nginx——
# X-Accel-Buffering 只在离用户最近的这一层生效，串两层会有一层
# 照常缓冲且失效是静默的（流式不报错，只是攒一坨再吐）。
location /api/ {
    proxy_pass http://127.0.0.1:19180;  # 末尾无斜杠，保留 /api/ 前缀转给后端
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE 必需：关掉本层缓冲，逐条转发而不是攒够一批再吐
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location /health {
    proxy_pass http://127.0.0.1:19180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# 前端产物：CD 把每次发布解到 /www/chatagents/frontend/<tag>，
# current 是指向当前版本的软链接。这是仓库里唯一写死宿主绝对路径
# 的一行——换机器时只需要改这一行（ADR-0032）。
location / {
    root /www/chatagents/frontend/current;
    index index.html;

    # /s/<uuid> 这类前端路由要回退到 index.html，交给 React Router 处理，
    # 否则刷新会 404——vite dev 免费给、vite build 之后不再自动提供。
    try_files $uri $uri/ /index.html;
}
