name: Release

# 发布流水线：打一个 git tag 就发布。
# 这不是门禁——PR 门禁在 ci.yml，两条独立的 workflow。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/ellisyuan/chatagents-backend

jobs:
  backend-image:
    name: 构建并推送后端镜像
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  openapi-contract:
    name: 生成 OpenAPI 契约产物（供前端构建取型）
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --project backend --locked
      - name: Export OpenAPI schema
        run: uv run --project backend python scripts/export-openapi.py "$RUNNER_TEMP/chatagents-openapi.json"
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatagents-openapi-${{ github.ref_name }}
          path: ${{ runner.temp }}/chatagents-openapi.json
          if-no-files-found: error
          retention-days: 1

  frontend-dist:
    name: 构建前端产物
    runs-on: ubuntu-latest
    needs: openapi-contract
    defaults:
      run:
        working-directory: frontend
    env:
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: chatagents-openapi-${{ github.ref_name }}
          path: ${{ runner.temp }}
      - name: Install frontend dependencies
        run: npm ci
      # OPENAPI_INPUT 只能落在 step 级：runner context 在 job 级 env 里不可用，
      # 写在那儿会让整份 workflow 判为无效（零 job 运行，且报错不指向具体行）。
      - name: Build frontend
        env:
          OPENAPI_INPUT: ${{ runner.temp }}/chatagents-openapi.json
        run: npm run build
      - name: Archive dist
        run: tar -czf "$RUNNER_TEMP/frontend-dist-${{ github.ref_name }}.tar.gz" -C dist .
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: ${{ runner.temp }}/frontend-dist-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-image, frontend-dist]
    steps:
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: ${{ runner.temp }}
      - name: Create release with frontend dist attached
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/frontend-dist-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

  deploy:
    name: SSH 触发 deploy.sh
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Run deploy.sh on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /www/chatagents/repo
            bash scripts/deploy.sh "${{ github.ref_name }}"
